# Suite del motor en Linux.
#
# Que las pruebas pasen en el Mac del desarrollador no prueba que pasen en
# otra parte: la reproducibilidad que promete el informe se apoya en
# renv.lock, y este flujo es lo unico que comprueba que ese archivo
# reconstruye un entorno donde la suite corre de verdad.
#
# El paso "sin skips" no es decorativo. Una prueba omitida es una prueba
# que no existe, y la suite entera se presenta en el informe como "0
# omitidas": si eso deja de ser cierto, el CI tiene que decirlo.

name: pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testthat:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Dependencias de sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Suite del motor
        run: |
          Rscript -e '
            r <- as.data.frame(testthat::test_local("pkg/calibraqca", reporter = "silent"))
            fallos  <- sum(r$failed) + sum(r$error)
            omitidas <- sum(r$skipped)
            cat("PASAN   :", sum(r$passed), "\n")
            cat("FALLOS  :", fallos, "\n")
            cat("AVISOS  :", sum(r$warning), "\n")
            cat("OMITIDAS:", omitidas, "\n")
            if (fallos > 0) stop("La suite tiene fallos.")
            if (omitidas > 0) stop("Hay pruebas omitidas: una prueba omitida es una prueba que no existe.")
          '

      - name: Dossier de validacion externa
        run: |
          # `--vanilla` ignora .Rprofile, que es donde renv activa su biblioteca:
          # sin esto, `digest` y `jsonlite` no se encuentran en el runner aunque
          # esten en renv.lock. Se conserva `--vanilla` (cada prueba corre aislada,
          # como documenta el plan) y se le pasa la biblioteca por R_LIBS_SITE.
          LIB="$(Rscript -e 'cat(renv::paths$library())')"
          test -d "$LIB" || { echo "Biblioteca de renv no encontrada: $LIB"; exit 1; }
          n=0
          for t in validation/tests/*.R; do
            R_LIBS_SITE="$LIB" Rscript --vanilla "$t" || exit 1
            n=$((n + 1))
          done
          test "$n" -ge 5 || { echo "Solo corrieron $n pruebas del dossier; se esperan 5 o mas."; exit 1; }
          echo "Dossier: $n pruebas en verde."

      - name: Cada paquete citado en el informe se invoca de verdad
        run: |
          Rscript -e '
            pkgload::load_all("pkg/calibraqca", quiet = TRUE)
            r <- as.data.frame(testthat::test_local("pkg/calibraqca",
                                                    filter = "paquetes-declarados",
                                                    reporter = "silent"))
            if (sum(r$failed) + sum(r$error) > 0) stop("El guardian de paquetes falla.")
            cat("guardian de paquetes: en verde\n")
          '

  interfaz:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Sin esto shinytest2 se omite solo y el trabajo pasaria en verde sin
      # haber abierto un navegador. El runner tambien la fija; aqui se
      # declara para que no dependa de eso.
      NOT_CRAN: "true"
      # Aqui vivia CHROMOTE_TIMEOUT=60, puesta el 2026-08-06 para que chromote
      # no se rindiera a los 10 s esperando el puerto de depuracion. Era
      # inerte: ese margen sale de getOption("chromote.timeout", 10) y esa
      # variable no la lee ni chromote ni shinytest2. El trabajo volvio a
      # verde ese dia por su cuenta, lo que hizo parecer que habia servido, y
      # el 2026-08-08 volvio a agotarse el mismo margen de 10 s. El ajuste de
      # verdad esta en tests/interfaz.R, que ademas lo aplica fuera del CI.

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Dependencias de sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Chrome disponible para chromote
        run: |
          Rscript -e '
            ruta <- chromote::find_chrome()
            if (is.null(ruta) || !nzchar(ruta)) stop("No hay Chrome para chromote.")
            cat("Chrome:", ruta, "\n")
          '

      - name: La interfaz abierta en un navegador
        run: Rscript tests/interfaz.R
